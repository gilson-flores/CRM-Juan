<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA033"/>
      <stop offset="40%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E05500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle dark texture overlay -->
  <rect width="500" height="500" rx="24" fill="none" stroke="#222222" stroke-width="3"/>
  <circle cx="250" cy="140" r="160" fill="#FF7A00" opacity="0.08" filter="blur(30px)"/>

  <!-- JC Monogram -->
  <g transform="translate(250, 145)" text-anchor="middle">
    <!-- Outer Glow / Stroke -->
    <text x="0" y="30" font-family="Impact, Arial Black, sans-serif" font-size="140" font-style="italic" font-weight="900" fill="none" stroke="#FF7A00" stroke-width="6" letter-spacing="-4" filter="url(#glow)">JC</text>
    <text x="0" y="30" font-family="Impact, Arial Black, sans-serif" font-size="140" font-style="italic" font-weight="900" fill="url(#orangeGrad)" letter-spacing="-4">JC</text>
  </g>

  <!-- ELETRICISTA -->
  <text x="250" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#FFFFFF">ELETRICISTA</text>

  <!-- residencial / comercial -->
  <text x="250" y="280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#FF7A00">residencial / comercial</text>

  <!-- Divider with Lightning Bolt -->
  <line x1="80" y1="315" x2="225" y2="315" stroke="#FF7A00" stroke-width="2"/>
  <!-- Lightning Bolt -->
  <path d="M 252 300 L 243 317 L 249 317 L 246 330 L 257 313 L 251 313 Z" fill="#FF7A00"/>
  <line x1="275" y1="315" x2="420" y2="315" stroke="#FF7A00" stroke-width="2"/>

  <!-- Phone / WhatsApp -->
  <g transform="translate(140, 360)">
    <circle cx="15" cy="-8" r="14" fill="#FF7A00" opacity="0.2"/>
    <path d="M 10 -15 C 6 -15 3 -12 3 -8 C 3 -3 8 2 13 2 C 17 2 20 -1 20 -5 L 18 -6 L 15 -4 C 14 -4 12 -6 12 -7 L 14 -9 Z" fill="#FF7A00"/>
    <text x="40" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">47 997064183</text>
  </g>

  <!-- Instagram -->
  <g transform="translate(140, 405)">
    <circle cx="15" cy="-8" r="14" fill="#FF7A00" opacity="0.2"/>
    <rect x="8" y="-15" width="14" height="14" rx="4" fill="none" stroke="#FF7A00" stroke-width="1.8"/>
    <circle cx="15" cy="-8" r="3.5" fill="none" stroke="#FF7A00" stroke-width="1.8"/>
    <circle cx="19" cy="-12" r="1" fill="#FF7A00"/>
    <text x="40" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">jc_eletricistajoinville</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="435" x2="440" y2="435" stroke="#1f1f1f" stroke-width="1.5"/>

  <!-- Slogan -->
  <text x="250" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#FF7A00">QUALIDADE • SEGURANÇA • CONFIANÇA</text>
</svg>
